name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Don't run the test job for the daily data-commit (it commits with [skip ci],
# but guard anyway in case that ever changes).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Cache ML models (sentence-transformers)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: models-${{ hashFiles('requirements.txt') }}

      - name: Run tests
        run: pytest
