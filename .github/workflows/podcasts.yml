name: Daily podcast collection

# Podcast collection is RSS-only (transcript-tag first, show-notes fallback) —
# no yt-dlp/Whisper — so unlike YouTube it runs fine on CI. This keeps the
# Podcast Report tab fresh on the live site without the local machine on.

on:
  schedule:
    # 11:00 UTC — an hour after the daily news pipeline (10:00) to avoid
    # racing it on the push to master.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Override how far back to scan each feed (hours)"
        required: false
        default: ""

permissions:
  contents: write  # commit podcast.json + podcast_seen.json back to the repo

concurrency:
  group: podcast-pipeline
  cancel-in-progress: false

jobs:
  collect-podcasts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal dependencies
        # Collection only needs RSS parsing + config loading. No torch/whisper/
        # yt-dlp/openai — summarization happens on-demand in the dashboard.
        run: |
          python -m pip install --upgrade pip
          pip install feedparser PyYAML python-dotenv

      - name: Collect podcasts
        run: |
          mkdir -p data/logs
          LOOKBACK="${{ github.event.inputs.lookback_hours }}"
          if [ -n "$LOOKBACK" ]; then
            python scripts/collect_podcasts.py --lookback-hours "$LOOKBACK"
          else
            python scripts/collect_podcasts.py
          fi

      - name: Commit podcast output back to repo
        run: |
          git config user.name "nfl-news-agent-bot"
          git config user.email "nfl-news-agent-bot@users.noreply.github.com"

          DAY="$(date -u +%F)"
          # data/ is gitignored; force-add only the podcast artifacts (never a
          # broad `git add data/`, so visitor-written files like
          # data/flagged_findings.json are never touched).
          for path in "data/raw/${DAY}/podcast.json" "data/podcast_seen.json"; do
            if [ -e "$path" ]; then
              git add -f "$path"
              echo "Staged: $path"
            else
              echo "Skipped (missing): $path"
            fi
          done

          if git diff --staged --quiet; then
            echo "No podcast changes to commit."
            exit 0
          fi

          git commit -m "Podcast episodes ${DAY} [skip ci]"

          # Push with rebase-retry — master may have moved (e.g. the daily
          # pipeline) while this ran.
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt). Rebasing onto latest master..."
            git fetch origin master
            git rebase origin/master
          done
          echo "Push failed after 3 attempts."
          exit 1
