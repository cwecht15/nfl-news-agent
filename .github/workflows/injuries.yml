name: Injury report refresh

# Re-reads the practice reports / game designations (team sites, RotoWire,
# NFL.com), re-runs the projection audit and folds the changes into today's
# report. Skips itself in the offseason.
#
# The primary trigger is a workflow_dispatch from the local
# NFL_News_Agent_Injuries task (scripts/run_injuries.bat), because GitHub fires
# this repo's crons hours late. Clubs post practice reports ~3:30-5 PM ET and
# the Friday report carries the game designations. These crons are fallbacks
# for when that machine is off (ET in comments; the DST shift moves them an
# hour in Nov):
#   Wed/Thu 21:17 → 5:17 PM ET   practice reports (Wed = TNF designations)
#   Fri 20:47 / 22:17 / 23:47    4:47 / 6:17 / 7:47 PM ET — designations
#   Sat 21:17 → 5:17 PM ET       Monday-night designations

on:
  schedule:
    - cron: "17 21 * * 3"
    - cron: "17 21 * * 4"
    - cron: "47 20 * * 5"
    - cron: "17 22 * * 5"
    - cron: "47 23 * * 5"
    - cron: "17 21 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  injuries:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Check season phase
        id: phase
        run: |
          pip install PyYAML >/dev/null
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          phase = str(yaml.safe_load(open("config/settings.yaml", encoding="utf-8")).get("season", {}).get("phase", "offseason")).lower()
          print(f"in_season={'true' if phase in ('in_season','inseason','in-season','season') else 'false'}")
          PY

      - name: Install Python dependencies
        if: steps.phase.outputs.in_season == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore secrets onto disk
        if: steps.phase.outputs.in_season == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p secrets
          echo "GOOGLE_SERVICE_ACCOUNT_KEY=${GITHUB_WORKSPACE}/secrets/service_account.json" > .env
          if [ -n "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]; then
            printf '%s' "${GOOGLE_SERVICE_ACCOUNT_JSON}" > secrets/service_account.json
            chmod 600 secrets/service_account.json
          fi

      - name: Refresh injury report + audit
        if: steps.phase.outputs.in_season == 'true'
        run: |
          mkdir -p data/logs
          python scripts/run_afternoon.py --injuries-only 2>&1 | tee -a "data/logs/$(TZ=America/New_York date +%F)-injuries.log"

      - name: Commit output back to repo
        if: steps.phase.outputs.in_season == 'true'
        run: |
          git config user.name "nfl-news-agent-bot"
          git config user.email "nfl-news-agent-bot@users.noreply.github.com"
          for path in data/injuries data/audit data/reports data/logs; do
            if [ -e "$path" ]; then git add -f "$path"; fi
          done
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Injury report refresh $(TZ=America/New_York date +%F) [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then exit 0; fi
            git fetch origin master
            # Another run committed between our checkout and this push. These
            # files are this run's own output, so ours win on a conflicting
            # hunk (-X theirs favours the commit being replayed) and the other
            # run's files come across untouched. Without this the rebase stops
            # on the conflict and the run's data is thrown away - a Saturday
            # batch of practice-squad elevations was lost that way 2026-09-19.
            git rebase -X theirs origin/master || { git rebase --abort || true; sleep 5; }
          done
          exit 1
