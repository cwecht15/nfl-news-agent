name: In-season afternoon update

# Light in-season run: NFL.com transactions + nflverse roster + OurLads
# reserve-list crossings + injury reports + projection audit, then update
# the day's report in place. No LLM calls. Exits immediately (and commits
# nothing) while config/settings.yaml has season.phase: offseason.
#
# 22:00 UTC = 18:00 EDT / 17:00 EST — after the ~4 PM ET practice reports
# and Saturday's elevation announcements.

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Report date to update (YYYY-MM-DD, default today)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  # Shares the daily pipeline's group so an AM run that overran never
  # writes data/ at the same time as this one.
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  afternoon:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Check season phase
        id: phase
        run: |
          pip install PyYAML >/dev/null
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          phase = str(yaml.safe_load(open("config/settings.yaml", encoding="utf-8")).get("season", {}).get("phase", "offseason")).lower()
          print(f"in_season={'true' if phase in ('in_season','inseason','in-season','season') else 'false'}")
          PY
          echo "phase output written"

      - name: Install Python dependencies
        if: steps.phase.outputs.in_season == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore secrets onto disk
        if: steps.phase.outputs.in_season == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p secrets
          echo "GOOGLE_SERVICE_ACCOUNT_KEY=${GITHUB_WORKSPACE}/secrets/service_account.json" > .env
          if [ -n "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]; then
            printf '%s' "${GOOGLE_SERVICE_ACCOUNT_JSON}" > secrets/service_account.json
            chmod 600 secrets/service_account.json
          fi

      - name: Run afternoon update
        if: steps.phase.outputs.in_season == 'true'
        run: |
          mkdir -p data/logs
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then DATE_ARG="--date ${{ github.event.inputs.date }}"; fi
          python scripts/run_afternoon.py $DATE_ARG 2>&1 | tee "data/logs/$(date -u +%F)-afternoon.log"

      - name: Commit output back to repo
        if: steps.phase.outputs.in_season == 'true'
        run: |
          git config user.name "nfl-news-agent-bot"
          git config user.email "nfl-news-agent-bot@users.noreply.github.com"

          for path in \
              data/roster \
              data/injuries \
              data/audit \
              data/weekly_projections \
              data/schedule \
              data/reports \
              data/depth_charts \
              data/raw \
              data/logs; do
            if [ -e "$path" ]; then
              git add -f "$path"
              echo "Staged: $path"
            else
              echo "Skipped (missing): $path"
            fi
          done

          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Afternoon in-season run $(date -u +%F) [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt). Rebasing onto latest master..."
            git fetch origin master
            git rebase origin/master
          done
          echo "Push failed after 3 attempts."
          exit 1
