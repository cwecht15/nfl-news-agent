name: Master Sheet Snapshot

on:
  schedule:
    # 11:00 UTC — runs an hour after the daily pipeline (10:00 UTC) so
    # the master sheet has time to absorb the morning's NFL.com tx feed.
    - cron: "0 11 * * *"
  workflow_dispatch:  # manual "Run workflow" button on the Actions tab

permissions:
  contents: write  # needed to commit the snapshot back to the repo

concurrency:
  group: master-sheet-snapshot
  cancel-in-progress: true  # if a manual run lands on top of another, take the latest

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth pyyaml

      - name: Restore service-account JSON
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p secrets
          printf '%s' "${GOOGLE_SERVICE_ACCOUNT_JSON}" > secrets/service_account.json
          chmod 600 secrets/service_account.json
          echo "GOOGLE_SERVICE_ACCOUNT_KEY=${GITHUB_WORKSPACE}/secrets/service_account.json" >> "$GITHUB_ENV"

      - name: Snapshot master sheet
        run: python scripts/snapshot_master_sheet.py

      - name: Commit snapshot back to repo
        run: |
          git config user.name "nfl-news-agent-bot"
          git config user.email "nfl-news-agent-bot@users.noreply.github.com"

          git add -f data/master_sheet/latest.json

          if git diff --staged --quiet; then
            echo "No snapshot changes to commit."
            exit 0
          fi

          git commit -m "Master sheet snapshot $(date -u +%FT%TZ) [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt). Rebasing onto latest master..."
            git fetch origin master
            git rebase origin/master
          done
          echo "Push failed after 3 attempts."
          exit 1
