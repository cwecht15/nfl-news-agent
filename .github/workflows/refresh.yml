name: On-demand refresh
run-name: "Refresh ${{ inputs.targets }} · ${{ inputs.nonce }}"

# Dispatched by the cloud dashboard's Refresh buttons
# (dashboard/_workflow_dispatch.py) from the Roster State / Injury Report /
# Inactives / Projection Audit / Team pages. Rosters, transactions, elevations,
# injury designations and inactives all move faster than this repo's crons, and
# GitHub fires them a median 242 minutes late on top of that — this is the
# escape hatch that does not require the local machine to be awake.
#
# Runs only the collectors the requested targets need (scripts/run_afternoon.py
# --only), re-runs the projection audit, folds the results into today's report
# *in place* and commits. It never authors a report and never re-reads the
# projection sheet, so it cannot move the active-week pointer as a side effect.
#
# It deliberately shares the daily-pipeline concurrency group: a refresh queues
# behind an in-flight run rather than writing data/ alongside it. The dashboard
# surfaces that wait as "queued" so it is visible rather than mysterious.
#
# No cron — this workflow exists only to be dispatched.

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated: roster, elevations, injuries, inactives, transactions — or 'all'"
        required: false
        default: "all"
      date:
        description: "Report date to update (YYYY-MM-DD, default: today ET)"
        required: false
        default: ""
      nonce:
        description: "Correlation id set by the dashboard so it can find this run. Blank for a manual run."
        required: false
        default: ""
      requested_by:
        description: "dashboard / dashboard-local / manual"
        required: false
        default: "manual"

permissions:
  contents: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Check season phase
        id: phase
        run: |
          pip install PyYAML >/dev/null
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          phase = str(yaml.safe_load(open("config/settings.yaml", encoding="utf-8")).get("season", {}).get("phase", "offseason")).lower()
          print(f"in_season={'true' if phase in ('in_season','inseason','in-season','season') else 'false'}")
          PY

      - name: Install Python dependencies
        if: steps.phase.outputs.in_season == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Only the `inactives` target needs this: run_odds_step reads the NFL Odds
      # project's sheets over gspread. Without the secret it logs a non-fatal
      # warning — the inactives still land, the line movement doesn't.
      - name: Restore secrets onto disk
        if: steps.phase.outputs.in_season == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p secrets
          echo "GOOGLE_SERVICE_ACCOUNT_KEY=${GITHUB_WORKSPACE}/secrets/service_account.json" > .env
          if [ -n "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]; then
            printf '%s' "${GOOGLE_SERVICE_ACCOUNT_JSON}" > secrets/service_account.json
            chmod 600 secrets/service_account.json
          fi

      # The inputs reach the shell through env vars, never through ${{ }}
      # interpolated into the script body: these are dispatch-supplied strings.
      - name: Run refresh
        if: steps.phase.outputs.in_season == 'true'
        env:
          TARGETS: ${{ inputs.targets }}
          DATE_IN: ${{ inputs.date }}
        run: |
          mkdir -p data/logs
          DATE_ARG=""
          if [ -n "$DATE_IN" ]; then DATE_ARG="--date $DATE_IN"; fi
          python scripts/run_afternoon.py --only "$TARGETS" $DATE_ARG 2>&1 \
            | tee -a "data/logs/$(TZ=America/New_York date +%F)-refresh.log"

      - name: Commit output back to repo
        if: steps.phase.outputs.in_season == 'true'
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          git config user.name "nfl-news-agent-bot"
          git config user.email "nfl-news-agent-bot@users.noreply.github.com"
          # Static union of every --only target's outputs. The checkout is fresh,
          # so force-adding a directory this run did not touch stages nothing.
          # Deliberately absent: data/weekly_projections, data/schedule and
          # data/depth_charts (no refresh target writes them) and
          # data/pipeline_status.json (a CI pid in the repo would confuse the
          # local dashboard's "is a run already going?" check).
          for path in data/roster data/injuries data/inactives data/audit \
                      data/odds data/reports data/raw data/logs; do
            if [ -e "$path" ]; then git add -f "$path"; fi
          done
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Dashboard refresh (${TARGETS}) $(TZ=America/New_York date +%F) [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then exit 0; fi
            git fetch origin master
            # Another run committed between our checkout and this push. These
            # files are this run's own output, so ours win on a conflicting hunk
            # (-X theirs favours the commit being replayed) and the other run's
            # files come across untouched.
            git rebase -X theirs origin/master || { git rebase --abort || true; sleep 5; }
          done
          exit 1
