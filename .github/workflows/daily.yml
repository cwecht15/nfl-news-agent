name: Daily NFL News pipeline

on:
  schedule:
    # 10:00 UTC = 06:00 EDT (summer) / 05:00 EST (winter).
    # GitHub Actions cron is UTC-only; pick once and live with the DST shift.
    - cron: "0 10 * * *"
  workflow_dispatch:  # also allow manual triggers from the Actions tab

permissions:
  contents: write  # needed to commit data/ back to the repo

concurrency:
  group: daily-pipeline
  cancel-in-progress: false  # never abort a run that's already producing data

jobs:
  run-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # GITHUB_TOKEN with contents:write is enough to push back to the repo.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ffmpeg (needed for Whisper transcription)
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Whisper + sentence-transformers models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/whisper
            ~/.cache/huggingface
            ~/.cache/torch
          key: ml-models-${{ hashFiles('config/settings.yaml', 'requirements.txt') }}
          restore-keys: |
            ml-models-

      - name: Restore secrets onto disk
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ATHLETIC_COOKIES: ${{ secrets.ATHLETIC_COOKIES }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          mkdir -p secrets
          # .env for the pipeline to load via python-dotenv
          {
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
            if [ -n "${ANTHROPIC_API_KEY}" ]; then echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}"; fi
            echo "GOOGLE_SERVICE_ACCOUNT_KEY=${GITHUB_WORKSPACE}/secrets/service_account.json"
            if [ -n "${ATHLETIC_COOKIES}" ]; then echo "ATHLETIC_COOKIES_PATH=${GITHUB_WORKSPACE}/secrets/athletic_cookies.txt"; fi
            if [ -n "${YOUTUBE_COOKIES}" ]; then echo "YOUTUBE_COOKIES_PATH=${GITHUB_WORKSPACE}/secrets/youtube_cookies.txt"; fi
          } > .env

          # Google service-account JSON (required for projection snapshots)
          if [ -n "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]; then
            printf '%s' "${GOOGLE_SERVICE_ACCOUNT_JSON}" > secrets/service_account.json
            chmod 600 secrets/service_account.json
          fi

          # Athletic cookies (optional)
          if [ -n "${ATHLETIC_COOKIES}" ]; then
            printf '%s' "${ATHLETIC_COOKIES}" > secrets/athletic_cookies.txt
            chmod 600 secrets/athletic_cookies.txt
          fi

          # YouTube cookies (optional but required for transcripts on CI —
          # YouTube blocks unauthenticated datacenter IPs)
          if [ -n "${YOUTUBE_COOKIES}" ]; then
            printf '%s' "${YOUTUBE_COOKIES}" > secrets/youtube_cookies.txt
            chmod 600 secrets/youtube_cookies.txt
          fi

      - name: Verify secrets restored correctly
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "=== .env contents (keys only) ==="
          if [ -f .env ]; then
            cut -d= -f1 .env | sort
          else
            echo "(.env missing!)"
          fi

          echo ""
          echo "=== secrets/ directory ==="
          ls -la secrets/ 2>/dev/null || echo "(secrets/ directory missing!)"

          echo ""
          echo "=== YouTube cookies ==="
          echo "YOUTUBE_COOKIES secret length in env: ${#YOUTUBE_COOKIES} chars"
          if [ -f secrets/youtube_cookies.txt ]; then
            echo "youtube_cookies.txt exists, size: $(wc -c < secrets/youtube_cookies.txt) bytes, lines: $(wc -l < secrets/youtube_cookies.txt)"
            echo "Has youtube.com entries: $(grep -c 'youtube.com' secrets/youtube_cookies.txt) lines"
            echo ""
            echo "--- First 5 lines (cat -A: ^I=tab, ^M=CR, $=LF) ---"
            head -5 secrets/youtube_cookies.txt | cat -A | sed 's/^/  /'
            echo ""
            echo "--- First 200 bytes (od -c) ---"
            head -c 200 secrets/youtube_cookies.txt | od -c | head -10 | sed 's/^/  /'
            echo ""
            echo "--- Tab count in first 10 lines (should be ~6 per cookie row) ---"
            head -10 secrets/youtube_cookies.txt | tr -d -c '\t' | wc -c | awk '{print "  Total tabs: " $1}'
            echo ""
            echo "--- Auto-fix: convert CRLF to LF and runs of 2+ spaces to tabs if needed ---"
            if file secrets/youtube_cookies.txt 2>/dev/null | grep -q CRLF; then
              echo "  CRLF detected — converting to LF"
              tr -d '\r' < secrets/youtube_cookies.txt > secrets/youtube_cookies.fixed && mv secrets/youtube_cookies.fixed secrets/youtube_cookies.txt
            fi
            if [ "$(head -10 secrets/youtube_cookies.txt | tr -d -c '\t' | wc -c)" -lt 5 ]; then
              echo "  No tabs detected — converting runs of 2+ spaces to tabs"
              sed -i 's/  \+/\t/g' secrets/youtube_cookies.txt
              echo "  After fix:"
              head -2 secrets/youtube_cookies.txt | cat -A | sed 's/^/    /'
            fi
          else
            echo "youtube_cookies.txt: MISSING (cookies will not be applied)"
          fi

      - name: Run daily pipeline
        run: |
          mkdir -p data/logs
          python scripts/run_daily.py 2>&1 | tee "data/logs/$(date -u +%F)-actions.log"

      - name: Commit pipeline output back to repo
        run: |
          git config user.name "nfl-news-agent-bot"
          git config user.email "nfl-news-agent-bot@users.noreply.github.com"

          echo "=== data/ contents before staging ==="
          du -sh data/* 2>/dev/null || echo "(no data/)"

          # data/ is gitignored for local convenience; force-add each
          # produced artifact independently so a single missing path
          # doesn't abort the whole stage.
          for path in \
              data/raw \
              data/reports \
              data/projections \
              data/depth_charts \
              data/transcripts \
              data/logs \
              data/source_health.json \
              data/youtube_seen.json \
              data/notebooklm_pushed.json; do
            if [ -e "$path" ]; then
              git add -f "$path"
              echo "Staged: $path"
            else
              echo "Skipped (missing): $path"
            fi
          done

          echo ""
          echo "=== Staged file count: $(git diff --staged --name-only | wc -l) ==="
          git diff --staged --name-only | head -20

          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          # [skip ci] prevents this commit from re-triggering workflows
          git commit -m "Daily pipeline run $(date -u +%F) [skip ci]"
          git push origin HEAD:master
