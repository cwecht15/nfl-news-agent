name: Game-day inactives

# Polls ESPN game rosters right after each inactives window (teams
# declare ~90 minutes before kickoff), re-runs the projection audit and
# refreshes the day's report in place. Skips itself in the offseason.
#
# UTC crons (ET in comments; the DST shift moves these an hour in Nov):
#   Thu 23:50 → 7:50 PM ET   TNF (8:15 kick, inactives ~6:45)
#   Sun 16:05 → 12:05 PM ET  early window (1:00 kicks, inactives ~11:30)
#   Sun 19:35 → 3:35 PM ET   late window (4:05/4:25 kicks)
#   Sun 23:50 → 7:50 PM ET   SNF
#   Mon 23:50 → 7:50 PM ET   MNF
#   Sat 20:05 / 23:50         Saturday slates (Dec) — harmless no-ops otherwise
#   Wed 23:50 / Fri 23:50     Week 1 opener / Black Friday — no-ops otherwise

on:
  schedule:
    - cron: "50 23 * * 3"
    - cron: "50 23 * * 5"
    - cron: "50 23 * * 4"
    - cron: "5 16 * * 0"
    - cron: "35 19 * * 0"
    - cron: "50 23 * * 0"
    - cron: "50 23 * * 1"
    - cron: "5 20 * * 6"
    - cron: "50 23 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  inactives:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Check season phase
        id: phase
        run: |
          pip install PyYAML >/dev/null
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          phase = str(yaml.safe_load(open("config/settings.yaml", encoding="utf-8")).get("season", {}).get("phase", "offseason")).lower()
          print(f"in_season={'true' if phase in ('in_season','inseason','in-season','season') else 'false'}")
          PY

      - name: Install Python dependencies
        if: steps.phase.outputs.in_season == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore secrets onto disk
        if: steps.phase.outputs.in_season == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p secrets
          echo "GOOGLE_SERVICE_ACCOUNT_KEY=${GITHUB_WORKSPACE}/secrets/service_account.json" > .env
          if [ -n "${GOOGLE_SERVICE_ACCOUNT_JSON}" ]; then
            printf '%s' "${GOOGLE_SERVICE_ACCOUNT_JSON}" > secrets/service_account.json
            chmod 600 secrets/service_account.json
          fi

      - name: Poll inactives + audit
        if: steps.phase.outputs.in_season == 'true'
        run: |
          mkdir -p data/logs
          python scripts/run_afternoon.py --inactives-only 2>&1 | tee -a "data/logs/$(TZ=America/New_York date +%F)-inactives.log"

      - name: Commit output back to repo
        if: steps.phase.outputs.in_season == 'true'
        run: |
          git config user.name "nfl-news-agent-bot"
          git config user.email "nfl-news-agent-bot@users.noreply.github.com"
          for path in data/inactives data/audit data/odds data/reports data/logs; do
            if [ -e "$path" ]; then git add -f "$path"; fi
          done
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Game-day inactives $(date -u +%F) [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then exit 0; fi
            git fetch origin master
            git rebase origin/master
          done
          exit 1
