# NFL News Agent — Settings
# Runtime configuration. API keys go in .env (not here).

# Documentation only — NOT read by code. Describes deploy/crontab.example and
# the GitHub Actions crons. Run dates come from processing.season.today_et,
# which hardcodes America/New_York on purpose (see its docstring).
schedule:
  run_time: "06:00"
  timezone: "America/New_York"

summarization:
  provider: "openai"  # anthropic | openai | ollama
  max_output_tokens: 4096
  daily_token_budget: 500000  # Safety cap to control costs

openai:
  model: "gpt-5.4-mini"
  reasoning_effort: "high"
  service_tier: "default"
  # Per-section overrides for the OpenAI provider. Any omitted key falls
  # back to that section's built-in default, so deleting this block is safe.
  sections:
    # Team Notes — the player-news extractor that pulls per-player
    # developments out of article bodies. Historically ran at the LOWEST
    # quality in the pipeline (reasoning low, 1400 tokens, on the mini
    # model). These bump it; set `model: "gpt-5.4"` to upgrade ONLY this
    # section to the full model (~3.3x per-token cost, best quality).
    team_news:
      model: null              # null => use openai.model above
      reasoning_effort: "medium"
      # Responses API counts reasoning tokens against this cap. With the
      # wider 12-item pools, 1600 left some teams a single cut-off bullet
      # (reasoning ate the budget); 3200 gives output room to breathe.
      max_output_tokens: 3200
    # Line Movement lede — a short "what moved and what the news says" pass
    # over the deterministic mover list. Small on purpose: the section is
    # fully rendered without it, so this only adds the connective tissue.
    line_movement:
      model: null
      reasoning_effort: "low"
      max_output_tokens: 900

ollama:
  model: "gemma3:4b"
  base_url: "http://localhost:11434"
  timeout_seconds: 180
  temperature: 0.2

anthropic:
  model: "claude-sonnet-4-20250514"
  use_prompt_caching: true

content_filter:
  # Drop news items whose title matches any of these regex patterns
  # (case-insensitive) before deduplication and summarization. Saves
  # LLM tokens and prevents fluff (trivia, voting articles, jersey
  # reveals, off-cycle mock drafts) from leaking into Team Notes.
  enabled: true
  # Plain regex patterns (always dropped if matched)
  drop_patterns:
    - '\b(vote|voting)\b'
    - '\ball-time\b'
    - '\btrivia\b'
    - '\b(jersey|uniform) reveal\b'
    - '\b(rip-off|ripoff)\b'
    - '\bbest\s+\w+\s+player\b.*\?'
  # Mock-draft handling: drop "mock draft" titles unless the title
  # mentions one of these years (current and next NFL draft cycles).
  # Update annually.
  mock_draft_keep_years: ["2026", "2027"]
  # Patterns applied ONLY to a given source_type (the title for tweets is the
  # full tweet text). Insider Twitter lists include team house accounts that
  # post marketing/holiday content — strip that here without risking real RSS
  # headlines. Add more source_types (e.g. reddit) below as needed.
  drop_patterns_by_source_type:
    twitter:
      - '\bjuneteenth\b'
      - 'celebrat\w* (freedom|juneteenth|black history|independence)'
      - 'happy (juneteenth|fourth of july|independence day|thanksgiving|holidays?|new year|birthday|anniversary)'
      - 'join us (in|as we) celebrat'
      - '\btune in\b.*(broadcast|special|premiere|watch party|tonight|this (sunday|week))'
      - '\b(giveaway|sweepstakes|enter to win|raffle)\b'
      - 'tickets? (on sale|available|presale|now available)'
      - '\b(presale|flash sale|shop now|link in bio|promo code|use code)\b'
      - 'single[- ]game tickets'

cross_day_dedup:
  # Suppress today's items whose title is a near-duplicate of something
  # already collected in the prior `lookback_days` days. Runs after
  # intra-day dedup and before summarization, so filtered items do not
  # consume LLM tokens.
  enabled: true
  lookback_days: 2
  # Cosine similarity (0-1) at which an item is considered a repeat.
  # Higher = stricter (fewer items suppressed). Intra-day dedup uses 0.75.
  threshold: 0.82
  # Categories exempt from cross-day suppression. Transactions are usually
  # unique events per day, but similar structural wording ("Player X:
  # Exclusive rights signing") can trip the filter.
  skip_categories: ["transaction"]
  # Titles matching any of these regexes (case-insensitive) are exempt —
  # rolling articles republished daily with fresh content under a
  # near-identical title (e.g. ESPN's per-team "training camp: Latest
  # intel, updates" pages).
  skip_title_patterns:
    - 'training camp:?\s*latest\b'

injury_classifier:
  # Retag news items whose title is PRIMARILY an injury-status update into
  # the Injuries section. Without this, only NFL.com's game-week injury
  # pages produce category="injury", so the section is empty all offseason
  # while camp injuries fight for Team Notes slots. Title-based and
  # precision-first: positive notes ("returns to practice") stay in Team
  # Notes. Omit patterns/exclude_patterns to use the built-in defaults in
  # processing/quality_filter.py; set them here to override.
  enabled: true

league_wide:
  # Untagged tweets matching any of these regexes (case-insensitive) are
  # never eligible for League-Wide Notes — other-sport chatter that passes
  # the news-signal gate via words like "trade". ONLY unambiguous names:
  # never Cardinals/Giants/Jets/Panthers/Rangers/Kings/Hawks, which
  # collide with NFL or crossover usage.
  twitter_exclude_patterns:
    - '\b(MLB|NBA|NHL|WNBA|NWSL|MLS)\b'
    - '\b(Dodgers|Yankees|Mets|Phillies|Braves|Astros|Cubs|Red Sox|White Sox|Blue Jays|Orioles|Mariners|Diamondbacks|Rockies|Pirates|Reds|Royals|Twins|Angels|Athletics|Rays|Brewers|Nationals|Marlins|Padres|Guardians|Tigers)\b'

team_notes:
  # Max news items per team fed to the Team Notes LLM call (code default 8).
  # During camp a busy team can have 90+ candidates; 12 widens coverage at
  # roughly +38k input tokens/day (cents on the mini model).
  item_limit: 12
  # Max entries in the per-team flat "Sources" list of the built report
  # (code default 6). Dashboard [N] citations come from numbered_sources
  # and are not capped by this; raised to keep pace with item_limit.
  source_limit: 10

collection:
  # How far back to look for new content (hours)
  lookback_hours: 28  # Slightly > 24h to avoid gaps
  # Max videos to check per YouTube channel
  youtube_max_per_channel: 5
  # Concurrent team scans in the YouTube collector. Each team is a
  # separate channel so per-channel politeness still holds. Lower if
  # you start hitting YouTube rate limits.
  youtube_workers: 6
  # Delay between web requests (seconds) — be polite
  request_delay: 2.0
  # Request timeout (seconds)
  request_timeout: 30
  # User agent for web requests
  user_agent: "NFL-News-Agent/1.0 (personal project)"

reddit:
  enabled: true

fantasypoints:
  # Pull recent FantasyPoints articles into a dedicated section.
  # Auth values live in .env (FANTASYPOINTS_AUTH, FANTASYPOINTS_SOURCE).
  enabled: true
  lookback_hours: 24
  max_articles: 15

twitter:
  # X/Twitter list monitoring via the TwitterAPI.io REST API (a cheap
  # third-party scraper — $0.15 / 1,000 tweets, no monthly minimum).
  # Lists live in sources.yaml under `twitter_lists:`. API key in .env as
  # TWITTERAPI_IO_KEY. (Replaces the dead Nitter path.)
  enabled: true
  # How far back to pull on each run (hours). Sent server-side as sinceTime
  # so the API only returns — and only bills for — tweets in the window.
  lookback_hours: 28
  # Hard cap on new tweets pulled per run, across all lists. Each tweet is
  # billed, so this bounds cost on busy days (free agency, draft, game day).
  # ~$0.15/1k, so 1000 ≈ $4.50/mo worst case. Raised from 500 because the
  # insiders list (incl. team house accounts) exceeds 500 tweets / 28h.
  max_per_run: 1000
  # Replies are noisy and double the bill; default to originals + retweets.
  include_replies: false

transcription:
  # Whisper model: tiny, base, small, medium, large
  whisper_model: "small"
  # Delete audio files after transcription to save disk space
  delete_audio_after: true
  # Skip Whisper fallback for videos over this duration (seconds).
  # CPU inference on a 49-min stream can take 60-90+ minutes and has
  # hung the daily run. Captions are still tried first regardless.
  # Set to 0 to disable the gate.
  whisper_max_duration_seconds: 1800

dashboard:
  port: 8502
  host: "localhost"

storage:
  # How many days of reports to keep (older get deleted)
  reports_to_keep: 90
  # How many days of raw data to keep
  raw_data_to_keep: 7

logging:
  level: INFO
  # Log file is auto-named by date in data/logs/

# ---------------------------------------------------------------------------
# Season phase — the in-season / offseason switch.
#
# `offseason` runs the pipeline exactly as it always has (preseason sheet
# snapshot, six report sections). `in_season` adds the weekly-sheet
# snapshots, roster events/state, injury report tracker, projection audit
# and the afternoon run. Nothing offseason is removed — flip this back to
# `offseason` next spring.
# ---------------------------------------------------------------------------
season:
  phase: in_season            # offseason | in_season
  year: 2026
  # The secondary projections sheet is only the "working copy" on Tuesday
  # (next week's projections start there while MNF finishes). Once the main
  # sheet flips to the next week the main sheet wins every tie.
  secondary_weekdays: [Tue]

projections:
  # Documents the constants hardcoded in scripts/snapshot_projections.py.
  # Not read by code — the offseason snapshotter is intentionally untouched.
  offseason:
    spreadsheet_id: "1bQtJKplmdOAEmKA1zCdSe8TeVFdOqO3fd-vUgtP1dH0"
    player_sheet: PreSeas_Working_Plyr_Proj
    fantasy_sheet: Preseason_Projections
    team_sheet: Working_Tm_Proj
  # Weekly in-season sheets (identical layouts). Read by
  # processing/weekly_projections.py when season.phase == in_season.
  in_season:
    sheets:
      primary: "1zry9ZCAOoevHN9-EnVpGt7YzHmq8MuUZA_AjXjJO250"
      secondary: "1UE8y1akwZ6-LUim5Lph3OXTwLwCLVmuCS5Ma1omaA5U"
    game_sheet: Working_Game_Proj        # C1 season, C2 week, header row 4
    player_sheet: Working_Player_Proj    # 32 team blocks; header row where G=="ID"
    output_sheet: Player_Projections     # PPR + POS Rank
    kicker_sheet: Working_Kicker_Proj    # header row 2
    schedule_sheet: Schedule
    positions: [QB, RB, WR, TE, K]

roster:
  # nflverse daily roster CSV — GSIS-keyed baseline for roster status.
  nflverse_url: "https://github.com/nflverse/nflverse-data/releases/download/rosters/roster_{year}.csv"
  ir_min_games: 4               # games a player must miss after an IR placement
  max_elevations: 3             # standard practice-squad elevations per season
  confirm_window_days: 3        # news-only events older than this become "unconfirmed" alerts
  apply_reported_events: true   # let a fresh insider report drive status until official
  # An official NFL.com move up to this many days older than the nflverse
  # baseline still overrides it when nflverse hasn't caught up (still shows
  # the pre-move status on the same team). nflverse lagged a Sept 7
  # termination by 2+ days; the old 1-day grace let it fall through.
  official_override_days: 7

injury_report:
  enabled: true
  # Precedence order. Team sites are official and show the full Wed/Thu/Fri
  # grid; RotoWire is a league-wide JSON cross-check; NFL.com is the fallback.
  sources: [team_sites, rotowire, nflcom]
  team_site_workers: 8

projection_audit:
  enabled: true
  positions: [QB, RB, WR, TE, K]
  # Market cross-checks (need the `odds` block below). Every verdict here is
  # one the NFL Odds project already computed against calibrated bands, so
  # there is no second set of thresholds to tune.
  market:
    enabled: true
    # Market_Check flags worth an alert. AMBER fires on ~100 player-stats a
    # week — informational, not actionable — so only RED is surfaced.
    gap_flags: [RED]
    max_gap_alerts: 25
    # Nearly every active skill player carries an anytime-TD price, so a bare
    # TD quote proves nothing. Require a real rate before flagging a player as
    # "quoted but not projected"; a yardage or reception line has no floor
    # because having one at all means the market expects volume.
    market_only_min:
      anytime_td: 0.20
      rush_tds: 0.20
      rec_tds: 0.20
      pass_tds: 0.50

inactives:
  # Game-day inactives from ESPN's per-game rosters (active flag before
  # kickoff, didNotPlay after). Polled by the pipeline steps and by the
  # game-day cron in .github/workflows/inactives.yml.
  enabled: true

odds:
  # Read-only view of the NFL Odds project (Projects/NFL Odds), which pulls The
  # Odds API and prices it against these same weekly sheets. The news agent
  # never calls a betting API — no key, no credits. The same fp-data service
  # account already reads both books.
  enabled: true
  odds_sheet_id: "1VOziAer_tNTlcvsHsmvY1M04-y0dx_D2lXhAYNkdw2w"
  game_lines_tab: SB_GameLines
  status_tab: Pull_Status
  status_row: 3                 # sportsbook row (Kalshi/Polymarket = 2, projections = 4)
  history_sheet_id: "16dHZfn082zszTW1dJY3d_OKnkgaBdMUC0om1FFOLlMc"
  history_tab_prefix: ""        # tab per season-week: 2026_W01
  # Past this the lines are labelled stale in the report and stop firing audit
  # alerts. The odds repo pulls Tue 9a / Thu 4p / Sat 9p / Sun 11:45a+7:30p /
  # Mon 7:30p ET, so a Wed or Fri report legitimately sees a ~24h-old pull.
  max_pull_age_hours: 30
  min_books: 2                  # fewer books quoting -> THIN, never a change
  thresholds:                   # movement worth a bullet
    spread: 0.5
    total: 1.0
    moneyline: 15               # American-odds cents
    props:
      pass_yds: 8
      pass_att: 1.5
      completions: 1.0
      pass_tds: 0.15
      ints: 0.1
      rush_att: 1.5
      rush_yds: 6
      rush_tds: 0.06
      receptions: 0.5
      rec_yds: 6
      rec_tds: 0.05
      rush_rec_yds: 8
      anytime_td: 0.10   # expected-TD rate (lambda), not a probability
    # Floor for a "quoted but not projected" bullet. Nearly every active skill
    # player carries an anytime-TD price, so a bare low TD quote proves nothing;
    # a yardage or reception line has no floor because having one at all means
    # the market expects volume.
    market_only_min:
      anytime_td: 0.20
      rush_tds: 0.20
      rec_tds: 0.20
      pass_tds: 0.50
  report:
    max_games: 16
    max_props: 15
    llm_lede: true              # one small call; false = deterministic only
