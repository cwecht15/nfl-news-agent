# NFL News Agent — Settings
# Runtime configuration. API keys go in .env (not here).

schedule:
  run_time: "06:00"
  timezone: "America/New_York"

summarization:
  provider: "openai"  # anthropic | openai | ollama
  max_output_tokens: 4096
  daily_token_budget: 500000  # Safety cap to control costs

openai:
  model: "gpt-5.4-mini"
  reasoning_effort: "high"
  service_tier: "default"
  # Per-section overrides for the OpenAI provider. Any omitted key falls
  # back to that section's built-in default, so deleting this block is safe.
  sections:
    # Team Notes — the player-news extractor that pulls per-player
    # developments out of article bodies. Historically ran at the LOWEST
    # quality in the pipeline (reasoning low, 1400 tokens, on the mini
    # model). These bump it; set `model: "gpt-5.4"` to upgrade ONLY this
    # section to the full model (~3.3x per-token cost, best quality).
    team_news:
      model: null              # null => use openai.model above
      reasoning_effort: "medium"
      max_output_tokens: 1600

ollama:
  model: "gemma3:4b"
  base_url: "http://localhost:11434"
  timeout_seconds: 180
  temperature: 0.2

anthropic:
  model: "claude-sonnet-4-20250514"
  use_prompt_caching: true

content_filter:
  # Drop news items whose title matches any of these regex patterns
  # (case-insensitive) before deduplication and summarization. Saves
  # LLM tokens and prevents fluff (trivia, voting articles, jersey
  # reveals, off-cycle mock drafts) from leaking into Team Notes.
  enabled: true
  # Plain regex patterns (always dropped if matched)
  drop_patterns:
    - '\b(vote|voting)\b'
    - '\ball-time\b'
    - '\btrivia\b'
    - '\b(jersey|uniform) reveal\b'
    - '\b(rip-off|ripoff)\b'
    - '\bbest\s+\w+\s+player\b.*\?'
  # Mock-draft handling: drop "mock draft" titles unless the title
  # mentions one of these years (current and next NFL draft cycles).
  # Update annually.
  mock_draft_keep_years: ["2026", "2027"]

cross_day_dedup:
  # Suppress today's items whose title is a near-duplicate of something
  # already collected in the prior `lookback_days` days. Runs after
  # intra-day dedup and before summarization, so filtered items do not
  # consume LLM tokens.
  enabled: true
  lookback_days: 2
  # Cosine similarity (0-1) at which an item is considered a repeat.
  # Higher = stricter (fewer items suppressed). Intra-day dedup uses 0.75.
  threshold: 0.82
  # Categories exempt from cross-day suppression. Transactions are usually
  # unique events per day, but similar structural wording ("Player X:
  # Exclusive rights signing") can trip the filter.
  skip_categories: ["transaction"]

collection:
  # How far back to look for new content (hours)
  lookback_hours: 28  # Slightly > 24h to avoid gaps
  # Max videos to check per YouTube channel
  youtube_max_per_channel: 5
  # Concurrent team scans in the YouTube collector. Each team is a
  # separate channel so per-channel politeness still holds. Lower if
  # you start hitting YouTube rate limits.
  youtube_workers: 6
  # Delay between web requests (seconds) — be polite
  request_delay: 2.0
  # Request timeout (seconds)
  request_timeout: 30
  # User agent for web requests
  user_agent: "NFL-News-Agent/1.0 (personal project)"

reddit:
  enabled: true

fantasypoints:
  # Pull recent FantasyPoints articles into a dedicated section.
  # Auth values live in .env (FANTASYPOINTS_AUTH, FANTASYPOINTS_SOURCE).
  enabled: true
  lookback_hours: 24
  max_articles: 15

nitter:
  # Nitter instances for Twitter RSS (tried in order).
  # As of April 2026 all major public Nitter instances are dead.
  # To re-enable: self-host a Nitter fork with your own Twitter
  # session tokens, or use a paid RSS bridge service (e.g. RSS.app).
  instances: []
  enabled: false

transcription:
  # Whisper model: tiny, base, small, medium, large
  whisper_model: "small"
  # Delete audio files after transcription to save disk space
  delete_audio_after: true
  # Skip Whisper fallback for videos over this duration (seconds).
  # CPU inference on a 49-min stream can take 60-90+ minutes and has
  # hung the daily run. Captions are still tried first regardless.
  # Set to 0 to disable the gate.
  whisper_max_duration_seconds: 1800

dashboard:
  port: 8502
  host: "localhost"

storage:
  # How many days of reports to keep (older get deleted)
  reports_to_keep: 90
  # How many days of raw data to keep
  raw_data_to_keep: 7

logging:
  level: INFO
  # Log file is auto-named by date in data/logs/
