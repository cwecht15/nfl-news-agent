# Configurable News Sources
# Add/remove sources here without touching code.
# The pipeline reads this file on every run.

# ── RSS Feeds ────────────────────────────────────────────
rss_feeds:
  # Major national outlets
  - name: ESPN NFL
    url: https://www.espn.com/espn/rss/nfl/news
    category: national

  - name: Pro Football Talk
    url: https://profootballtalk.nbcsports.com/feed/
    category: national

  - name: CBS Sports NFL
    url: https://www.cbssports.com/rss/headlines/nfl/
    category: national

  - name: Yahoo Sports NFL
    url: https://sports.yahoo.com/nfl/rss/
    category: national

  - name: The Athletic NFL
    url: https://www.nytimes.com/athletic/rss/nfl/
    category: national

  # Add more feeds here:
  # - name: Your Feed Name
  #   url: https://example.com/feed
  #   category: national | team | analytics

# ── Beat Writers & Insiders ──────────────────────────────
# Each writer can declare any subset of sources: rss_feeds,
# youtube_channels, podcast_feeds. Items are tagged with the writer's
# name (author), outlet (part of source label), and declared teams
# (for team highlights). Items flow into the existing pipeline
# sections — no UI changes needed.
#
# Fields per writer:
#   name:    Display name; becomes `author` on each item.
#   outlet:  Display outlet; combined with name for the `source` label.
#   teams:   List of team abbreviations, e.g. ["BAL"]. Empty = national.
#            QUOTE "NO" (Saints) — unquoted NO parses as YAML false.
#   role:    "insider" | "beat" (metadata only).
#
# Source blocks (all optional — include whatever you have URLs for):
#   rss_feeds:        List of author/byline RSS URLs (Substacks, author
#                     archive feeds, outlet byline feeds).
#   youtube_channels: List of channel entries. Fields:
#                       id                     YouTube channel ID (required)
#                       handle                 e.g. "@NOF" (display only)
#                       keyword_filter         true = require global
#                                              youtube_keywords match in title
#                                              (default: false)
#                       transcribe             captions + Whisper fallback
#                                              (default: true)
#                       min_duration_seconds   drop videos shorter than this
#                                              — e.g. Shorts (default: 180)
#                       team_focus             require the writer's team to be
#                                              named in the title (default:
#                                              true when `teams` is set, else
#                                              false — i.e. national writers
#                                              get no team filter)
#   podcast_feeds:    List of {url, transcribe} entries.
#                     transcribe: false (default) = use episode show notes
#                     transcribe: true  = download MP3 + Whisper it (slow)
#
# Spotify note: Spotify audio is DRM-protected; use the show's
# underlying RSS feed instead (usually listed on Apple Podcasts or
# the show's website; podcastindex.org works as a lookup).

beat_writers:
  - name: Nick Underhill
    outlet: NewOrleans.Football
    teams: ["NO"]    # quoted because NO is a YAML boolean otherwise
    role: beat
    custom_feeds:
      - type: neworleans_football
        url: https://neworleans.football/api/feed
        authors: ["Nick Underhill"]   # omit/empty to include all site authors
        quickposts: false             # true = also include short live-feed posts
    youtube_channels:
      - id: UCO3-HuPUXFliHV_u-qc33bQ
        handle: "@NOF"
        keyword_filter: false
        transcribe: true

# Example entries — copy, uncomment, fill in real URLs/IDs to enable:
#
#   - name: Adam Schefter
#     outlet: ESPN
#     teams: []
#     role: insider
#     rss_feeds:
#       - https://www.espn.com/espn/rss/nfl/news
#     youtube_channels:
#       - id: UCxxxxxxxxxxxxxxxxx
#         handle: "@AdamSchefter"
#         keyword_filter: false
#     podcast_feeds:
#       - url: https://feeds.example.com/adam-schefter-show.xml
#         transcribe: false
#
#   - name: Jeff Zrebiec
#     outlet: The Athletic
#     teams: [BAL]
#     role: beat
#     rss_feeds:
#       - https://example-athletic-author-feed/zrebiec.xml

# ── Web Scraping Targets ─────────────────────────────────
web_sources:
  - name: NFL Transactions
    url: https://www.nfl.com/transactions/
    type: transactions
    enabled: true

  - name: NFL Injuries
    url: https://www.nfl.com/injuries/
    type: injuries
    enabled: true

  - name: The Athletic NFL
    url: https://www.nytimes.com/athletic/nfl/
    type: athletic_nfl
    category: national
    enabled: true
    max_items_per_team: 5

# ── YouTube Video Keywords ────────────────────────────────
# Videos matching ANY of these keywords in their title will be collected.
# Covers press conferences, interviews, and media availabilities.
youtube_keywords:
  # Press conferences
  - "press conference"
  - "presser"
  - "postgame"
  - "podium"
  - "media availability"
  - "the media"  # catches "addresses/talks to/meets the media" variants
  - "recap"     # "Recap Day X" GM/HC pressers; relevance scorer gates filler
  - "introductory press"
  - "draft press"
  # Interviews
  - "interview"
  - "1-on-1"
  - "one-on-one"
  - "sits down"
  - "speaks to"
  - "speaks at"
  - "speaks"
  - "Q&A"
  - "exclusive"
  # Coaches & GMs
  - "head coach"
  - "coordinator"
  - "general manager"
  - "GM"
  - "offensive coordinator"
  - "defensive coordinator"
  # Player announcements
  - "signing"
  - "sign with"
  - "signed with"
  - "chose to sign"
  - "free agency"
  - "introductory"
  - "welcome"
  - "extension"
  - "trade"
  - "on joining"
  - "joins the"
  # Owners & league events
  - "owner"
  - "owners meeting"
  - "combine"
  - "pro day"
  - "minicamp"
  - "OTA"
  - "training camp"
