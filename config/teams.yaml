# NFL Teams Configuration
# Updated 2026-04-13 with user-verified YouTube channels
#
# youtube_channels: list of channels to scan per team
#   - id: YouTube channel ID
#     handle: YouTube handle (for reference)
#     scan_streams: false to skip the /streams tab (defaults to true —
#       most teams publish pressers as live streams that land there)
#     keyword_filter: false to accept every video on the channel —
#       use only on dedicated press-conference channels where every
#       upload is a presser and the keyword filter loses signal, OR on
#       beat/analysis channels (pods, "Collective" shows) whose titles
#       aren't presser-style and would otherwise be filtered out entirely.

