# Streamlit runtime config.
# Streamlit Community Cloud applies these on deploy.

[server]
headless = true

[browser]
gatherUsageStats = false

[theme]
# Only override the accent color; leave background/text unset so Streamlit
# auto-detects the visitor's system theme (dark or light). Specifying any
# of those forces light mode and ignores the browser preference.
primaryColor = "#013369"  # NFL blue
