# Streamlit runtime config.
# Streamlit Community Cloud applies these on deploy.

[server]
headless = true

[browser]
gatherUsageStats = false

[theme]
# Default to dark mode for all visitors. Each visitor can still flip to
# light via the Streamlit Settings menu (hamburger icon → Settings →
# Theme), which is stored in their browser's localStorage.
base = "dark"
primaryColor = "#1d6dff"  # NFL-ish blue, brighter for dark backgrounds
